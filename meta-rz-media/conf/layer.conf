# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rz-media"
BBFILE_PATTERN_meta-rz-media = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-rz-media = "6"

LAYERDEPENDS_meta-rz-media = "meta-rz-bsp"
LAYERSERIES_COMPAT_meta-rz-media = "kirkstone scarthgap"

# Custom licenses
LICENSE_PATH += "${LAYERDIR}/files/custom-licenses"